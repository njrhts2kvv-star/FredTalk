name: Portable checks
on:
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/library/package-lock.json
      - run: python -m unittest discover -s tests
      - run: npm --prefix apps/library ci --ignore-scripts --no-audit --no-fund
      - run: npm --prefix apps/library run build
