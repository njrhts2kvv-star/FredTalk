name: Portable checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/library/package-lock.json
      - run: python -m unittest discover -s tests
      - run: node tests/test_review_timeline.cjs
      - run: python scripts/check_public_text.py --pattern 'b[o]b' --pattern '秋[芝]' --pattern 'Kenny[ ]Wang' --pattern '/[U]sers/'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: python -m pip install -r skills/audio-subtitle-roughcut/requirements.txt
      - run: python -m unittest discover -s skills/audio-subtitle-roughcut/scripts -p 'test_*.py'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: apps/library
      - run: npm run build
        working-directory: apps/library
