<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#202124;font:15px/1.7 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}header{padding:26px 28px 18px}h1{font-size:24px;margin:0 0 6px}header p{margin:4px 0;color:#666;font-size:14px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:14px}button,select{font:inherit;background:#fff;border:1px solid #d3d5d8;border-radius:6px;padding:7px 12px;color:#333;cursor:pointer}button.active{background:#222;color:#fff;border-color:#222}button:disabled,select:disabled{cursor:default;opacity:.5}.save,.scope-note{font-size:12px;color:#6a6f76}.save{margin-top:12px}.table-wrap{padding:0 28px 40px;overflow:auto}table{width:100%;border-collapse:separate;border-spacing:0;table-layout:fixed;border-left:1px solid #d9dce1;border-top:1px solid #d9dce1}col:nth-child(1){width:26%}col:nth-child(2){width:43%}col:nth-child(3){width:31%}th,td{border-right:1px solid #d9dce1;border-bottom:1px solid #d9dce1;padding:16px;vertical-align:top;text-align:left}th{background:#f3f4f5;position:sticky;top:0;z-index:2}td p{margin:8px 0 14px}.time{font-size:12px;color:#6a6f76;font-variant-numeric:tabular-nums}.narration{white-space:pre-line;line-height:1.85}figure{margin:0 0 14px}figcaption{font-size:13px;color:#666;margin-bottom:8px}video{width:100%;aspect-ratio:16/9;object-fit:contain;background:#171717;display:block;border-radius:6px}.file{font-size:12px;color:#555}.badge{display:inline-block;font-size:12px;background:#f0f1f2;padding:3px 9px;border-radius:4px}.badge.keep{background:#e9f3ed;color:#28623c}.badge.change{background:#fff3da;color:#785114}.choice-label{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;margin:10px 0}.empty{padding:34px 14px;background:#f7f8f9;border:1px dashed #d7dade;text-align:center;color:#777}.candidate{border-top:1px solid #e4e5e7;padding:14px 0}.candidate input{margin-right:7px}.asset-image{display:block;width:100%;padding:0;border:0;background:#f5f5f5;cursor:zoom-in}.asset-image img{display:block;width:100%;height:auto;max-height:480px;object-fit:contain}details{margin:12px 0}summary{font-size:13px;cursor:pointer;color:#555}tr[hidden]{display:none}.rich-feedback{white-space:pre-wrap;overflow-wrap:anywhere;min-height:140px;margin-top:12px;padding:12px;border:1px solid #d3d5d8;border-radius:8px;background:#fff;font-size:14px;line-height:1.8}.rich-feedback:focus{outline:2px solid #969da5;outline-offset:1px}.rich-feedback:empty:before{content:attr(data-placeholder);color:#999;pointer-events:none}.inline-feedback-image{display:inline-block;position:relative;max-width:100%;vertical-align:middle;margin:8px 0;white-space:normal}.inline-feedback-image img{display:block;max-width:100%;max-height:300px;border-radius:6px;cursor:zoom-in}.inline-feedback-image button{position:absolute;right:5px;top:5px;padding:0;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 5px #0004}.feedback-attachments{margin-top:8px}.feedback-attachments span{display:block;font-size:12px;color:#777;margin-top:4px}.history{font-size:13px}.history pre{white-space:pre-wrap;font:inherit;background:#f5f5f5;padding:10px}.history img{max-width:100%;max-height:180px}.image-preview{max-width:92vw;max-height:92vh;border:0;border-radius:12px;padding:16px}.image-preview::backdrop{background:#0009}.image-preview>button{display:block;margin-bottom:10px}.image-preview img{display:block;max-width:85vw;max-height:78vh;object-fit:contain}textarea[hidden]{display:none}@media(min-width:1600px){header,.table-wrap{max-width:1780px;margin:auto}}@media(max-width:900px){header{padding:18px 12px}.table-wrap{padding:0 12px 24px}th,td{padding:10px}body{font-size:14px}}@media(max-width:650px){table{min-width:900px}h1{font-size:20px}}
</style>
<body>
<header>
<h1>__TITLE__</h1>
<p>先看图文建议，再看真实关键帧，最后看视频。原文和意见始终在画面两侧。</p>
<p>__TIMING__ · 意见只保存在当前浏览器，导出后交给助手处理。</p>
<nav class="toolbar" aria-label="审看阶段"><button data-view-button="suggestion">图文建议</button><button data-view-button="keyframes">真实关键帧</button><button data-view-button="video">视频审看</button></nav>
<p id="view-hint"></p>
<nav class="toolbar" aria-label="筛选"><button data-filter="all">全部</button><button data-filter="pending">待看</button><button data-filter="keep">保留主体</button><button data-filter="change">需要修改</button><button data-filter="skip">先跳过</button><button id="export">导出选择与修改意见（含图片）</button></nav>
<div id="save-state" class="save" role="status">正在读取本机反馈…</div>
</header>
<main class="table-wrap"><table><colgroup><col><col><col></colgroup><thead><tr><th>逐字稿</th><th id="media-heading">画面建议</th><th>你的选择与修改意见</th></tr></thead><tbody>__ROWS__</tbody></table></main>
<script id="review-data" type="application/json">__REVIEW_DATA__</script>
<script>
(()=>{
'use strict';
const key=__STORAGE_KEY__,episodeKey=__EPISODE__,metadata=JSON.parse(document.querySelector('#review-data').textContent);
const rows=[...document.querySelectorAll('tbody tr')],byRow=new Map(metadata.map(item=>[item.rowId,item]));
const status=document.querySelector('#save-state'),assets=new Map(),editors=new Map(),pending=new Set(),drafts=new Map();
const recordKey=item=>JSON.stringify([item.stableId,item.view,item.itemId,item.identity]);
function read(){try{const value=JSON.parse(localStorage.getItem(key)||'{}');return value.schemaVersion===5?value:{schemaVersion:5,records:{},legacy:value}}catch{return {schemaVersion:5,records:{},legacy:{}}}}
function current(item,store){return drafts.get(recordKey(item))||(store||read()).records[recordKey(item)]||{choice:'',note:'',content:[],selectedRoute:'',candidateId:''}}
function hasChanges(record){return !!record.note?.trim()||record.content?.some(block=>block.type==='image')}
function effectiveChoice(record){return record.choice==='keep'&&hasChanges(record)?'change':record.choice||'pending'}
function verdict(record){if(record.choice==='keep'&&hasChanges(record))return '保留主体，仍需修改';return {keep:'当前画面可保留',change:'需要修改',skip:'先跳过'}[record.choice]||'待看'}
let activeView=__INITIAL_VIEW__,activeFilter='all';
const hints={suggestion:'助手给出建议，您选择制作方式和画面方向。未选择的部分保持待定。',keyframes:'这些图片来自实际动画代码。此处确认构图、文字、字幕和角标；动作节奏随后看视频。',video:'正常速度看当前视频，检查声音、节奏和衔接；历史视频可以展开对照。'};
function applyFilter(){
 const snapshot=read();
 for(const row of rows){const item=byRow.get(row.id),record=current(item,snapshot),choice=effectiveChoice(record);row.hidden=item.view!==activeView||(activeFilter!=='all'&&choice!==activeFilter);const badge=row.querySelector('.badge');badge.textContent=verdict(record);badge.className='badge '+choice}
 for(const button of document.querySelectorAll('[data-view-button]')){const active=button.dataset.viewButton===activeView;button.classList.toggle('active',active);button.setAttribute('aria-pressed',String(active))}
 for(const button of document.querySelectorAll('[data-filter]')){const filter=button.dataset.filter,count=metadata.filter(item=>item.view===activeView&&(filter==='all'||effectiveChoice(current(item,snapshot))===filter)).length;button.textContent=({all:'全部',pending:'待看',keep:'保留主体',change:'需要修改',skip:'先跳过'}[filter])+`（${count}项）`;button.classList.toggle('active',filter===activeFilter)}
 document.querySelector('#view-hint').textContent=hints[activeView];document.querySelector('#media-heading').textContent={suggestion:'画面建议',keyframes:'真实关键帧',video:'当前视频'}[activeView];
}
for(const button of document.querySelectorAll('[data-view-button]'))button.onclick=()=>{activeView=button.dataset.viewButton;activeFilter='all';document.querySelectorAll('video').forEach(video=>video.pause());applyFilter()};
for(const button of document.querySelectorAll('[data-filter]'))button.onclick=()=>{activeFilter=button.dataset.filter;applyFilter()};
const db=new Promise((resolve,reject)=>{const q=indexedDB.open(key+'-images',1);q.onupgradeneeded=()=>q.result.createObjectStore('images',{keyPath:'id'});q.onsuccess=()=>resolve(q.result);q.onerror=()=>reject(q.error)});
const transaction=async(mode,fn)=>{const database=await db;return new Promise((resolve,reject)=>{const tx=database.transaction('images',mode),q=fn(tx.objectStore('images'));tx.oncomplete=()=>resolve(q.result);tx.onerror=tx.onabort=()=>reject(tx.error)})};
const dialog=document.createElement('dialog');dialog.className='image-preview';const close=document.createElement('button');close.textContent='关闭大图';close.onclick=()=>dialog.close();const full=document.createElement('img');full.alt='放大的画面';dialog.append(close,full);document.body.append(dialog);dialog.onclick=event=>{if(event.target===dialog)dialog.close()};
function showImage(src){full.src=src;dialog.showModal()}
for(const button of document.querySelectorAll('.asset-image'))button.onclick=()=>showImage(button.querySelector('img').src);
function blocks(editor){const out=[];const text=value=>{if(!value)return;if(out.at(-1)?.type==='text')out.at(-1).text+=value;else out.push({type:'text',text:value})};function walk(node){if(node.nodeType===3){text(node.textContent);return}if(node.dataset?.imageId){out.push({type:'image',id:node.dataset.imageId});return}if(node.dataset?.pending)return;if(node.tagName==='BR'){text('\n');return}const line=['DIV','P'].includes(node.tagName);if(line&&out.length&&out.at(-1)?.text?.slice(-1)!=='\n')text('\n');for(const child of node.childNodes)walk(child);if(line&&node.nextSibling)text('\n')}for(const node of editor.childNodes)walk(node);return out}
function imageNode(item,save){const wrap=document.createElement('span');wrap.className='inline-feedback-image';wrap.contentEditable='false';wrap.dataset.imageId=item.id;const img=document.createElement('img');img.src=URL.createObjectURL(item.blob);img.alt=item.name;img.onclick=()=>showImage(img.src);const remove=document.createElement('button');remove.type='button';remove.textContent='×';remove.setAttribute('aria-label','删除意见图片');remove.onclick=()=>{wrap.remove();save()};wrap.append(img,remove);return wrap}
function appendContent(target,content,save){for(const block of content){if(block.type==='text')target.append(document.createTextNode(block.text));else if(assets.has(block.id)){if(save)target.append(imageNode(assets.get(block.id),save));else{const image=document.createElement('img');image.src=URL.createObjectURL(assets.get(block.id).blob);image.alt=assets.get(block.id).name;target.append(image)}}else{const missing=document.createElement('span');missing.dataset.imageId=block.id;missing.textContent='［图片暂不可用］';target.append(missing)}}}
function renderHistory(row,item){const store=read(),history=Object.values(store.records).filter(record=>record.stableId===item.stableId&&record.view===item.view&&record.itemId===item.itemId&&record.identity!==item.identity),legacy=store.legacy?.[item.stableId];const target=row.querySelector('.history');target.replaceChildren();if(legacy&&item.view==='video')history.push({...legacy,legacy:true});if(!history.length)return;const details=document.createElement('details'),summary=document.createElement('summary');summary.textContent=`以前的意见（${history.length}版，本版仍需审看）`;details.append(summary);for(const record of history){const label=document.createElement('p');label.textContent=(record.legacy?'旧版记录':record.updatedAt||'历史记录')+' · '+verdict(record);const content=document.createElement('pre');appendContent(content,record.content?.length?record.content:[{type:'text',text:record.note||''}]);details.append(label,content)}target.append(details)}
for(const row of rows){
 const item=byRow.get(row.id),old=current(item),textarea=row.querySelector('textarea'),select=row.querySelector('.decision'),route=row.querySelector('.route-choice');select.value=old.choice||'';if(route)route.value=old.selectedRoute||'';for(const radio of row.querySelectorAll('input[type=radio]'))radio.checked=radio.value===old.candidateId;
 textarea.hidden=true;const editor=document.createElement('div');editor.className='rich-feedback';editor.contentEditable='false';editor.setAttribute('role','textbox');editor.setAttribute('aria-multiline','true');editor.setAttribute('aria-label',textarea.getAttribute('aria-label'));editor.dataset.placeholder='写下具体怎么改，也可以在光标处贴图…';textarea.after(editor);
 const save=()=>{const content=blocks(editor),note=content.filter(block=>block.type==='text').map(block=>block.text).join(''),latest=read(),candidateId=row.querySelector('input[type=radio]:checked')?.value||'';latest.records[recordKey(item)]={...item,choice:select.value,reviewedVersion:select.value?item.identity:'',selectedRoute:route?.value||'',candidateId,note,content,updatedAt:new Date().toISOString()};drafts.set(recordKey(item),latest.records[recordKey(item)]);try{localStorage.setItem(key,JSON.stringify(latest));status.textContent='已保存到当前浏览器；导出后交给助手处理。'}catch{status.textContent='保存失败，请立即导出意见。'}applyFilter()};editors.set(row.id,{editor,save});editor.addEventListener('input',save);select.addEventListener('change',save);route?.addEventListener('change',save);for(const radio of row.querySelectorAll('input[type=radio]'))radio.addEventListener('change',save);
 let lastRange;function remember(){const selection=getSelection();if(selection.rangeCount&&editor.contains(selection.anchorNode))lastRange=selection.getRangeAt(0).cloneRange()}editor.addEventListener('keyup',remember);editor.addEventListener('mouseup',remember);editor.addEventListener('input',remember);
 function insert(node){editor.focus();const selection=getSelection();let range=lastRange;if(!range||!editor.contains(range.startContainer)){range=document.createRange();range.selectNodeContents(editor);range.collapse(false)}range.deleteContents();range.insertNode(node);range.setStartAfter(node);range.collapse(true);selection.removeAllRanges();selection.addRange(range);lastRange=range.cloneRange()}
 const toolbar=document.createElement('div');toolbar.className='feedback-attachments';const button=document.createElement('button');button.type='button';button.textContent='＋ 插入图片';const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=true;input.hidden=true;input.setAttribute('aria-label','插入意见图片');button.onmousedown=event=>{remember();event.preventDefault()};button.onclick=()=>input.click();const hint=document.createElement('span');hint.textContent='文字与图片按光标位置保存；点击图片可放大。';toolbar.append(button,input,hint);editor.after(toolbar);
 function add(files){remember();for(const file of files){if(!file.type.startsWith('image/'))continue;const placeholder=document.createElement('span');placeholder.dataset.pending='true';placeholder.contentEditable='false';placeholder.textContent='［图片保存中…］';insert(placeholder);const job=(async()=>{try{if(file.size>30*1024*1024)throw new Error('单张图片请小于 30 MB');const bitmap=await createImageBitmap(file);bitmap.close();const attachment={id:crypto.randomUUID(),row:row.id,recordKey:recordKey(item),name:file.name||'截图.png',type:file.type,blob:file,createdAt:new Date().toISOString()};await transaction('readwrite',store=>store.put(attachment));assets.set(attachment.id,attachment);if(placeholder.isConnected){placeholder.replaceWith(imageNode(attachment,save));save()}}catch(error){placeholder.remove();status.textContent='图片插入失败：'+error.message}})();pending.add(job);job.finally(()=>pending.delete(job))}}
 input.onchange=()=>{add([...input.files]);input.value=''};
 editor.addEventListener('paste',event=>{event.preventDefault();remember();const files=[...(event.clipboardData?.items||[])].filter(item=>item.kind==='file'&&item.type.startsWith('image/')).map(item=>item.getAsFile()).filter(Boolean);if(files.length)add(files);else{insert(document.createTextNode(event.clipboardData.getData('text/plain')));save()}});
 editor.addEventListener('dragover',event=>event.preventDefault());editor.addEventListener('drop',event=>{event.preventDefault();const range=document.caretRangeFromPoint?.(event.clientX,event.clientY);if(range&&editor.contains(range.startContainer))lastRange=range;add([...event.dataTransfer.files])});
}
const ready=transaction('readonly',store=>store.getAll()).then(items=>{items.forEach(item=>assets.set(item.id,item));for(const row of rows){const item=byRow.get(row.id),{editor,save}=editors.get(row.id),record=current(item);appendContent(editor,record.content?.length?record.content:[{type:'text',text:record.note||''}],save);editor.contentEditable='true';renderHistory(row,item)}status.textContent='已读取本机反馈；换画面后旧意见留在历史中。';document.body.dataset.ready='true';applyFilter()}).catch(()=>{status.textContent='图片存储读取失败，请刷新后重试；已有意见未改动。';document.body.dataset.ready='error';throw new Error('Storage unavailable')});ready.catch(()=>{});
const dataURL=blob=>new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)});
async function exportRecord(record,isCurrent){const content=await Promise.all((record.content||[]).map(async block=>{if(block.type==='text')return block;const asset=assets.get(block.id);if(!asset)throw new Error('意见图片暂不可用，请刷新后重试');return {...block,name:asset.name,dataUrl:await dataURL(asset.blob)}}));const candidate=record.artifact?.candidates?.find(item=>item.id===record.candidateId);return {...record,current:isCurrent,content,images:content.filter(block=>block.type==='image'),needsChanges:record.choice==='change'||hasChanges(record),approvalScope:record.view==='keyframes'?'static-frame':record.view==='suggestion'?'direction':'video-review',animationApproved:false,selectedRoute:record.selectedRoute||null,userSelection:record.candidateId==='__none__'?{decision:'none'}:candidate?{candidateId:candidate.id,sha256:candidate.image.sha256,imagePath:candidate.image.path}:null}}
async function exportData(){await ready;await Promise.all([...pending]);const store=read(),records={...store.records,...Object.fromEntries(drafts)},currentKeys=new Set();for(const row of rows){const item=byRow.get(row.id),id=recordKey(item);currentKeys.add(id);if(!records[id])records[id]={...item,choice:'',reviewedVersion:'',selectedRoute:'',candidateId:'',note:'',content:[]}}
 const legacyFeedback={};for(const [sid,record] of Object.entries(store.legacy||{})){const content=record.content||[{type:'text',text:record.note||''},...[...assets.values()].filter(item=>item.row===sid).map(item=>({type:'image',id:item.id}))];legacyFeedback[sid]=await exportRecord({...record,stableId:sid,view:'video',content},false)}
 return {schemaVersion:5,episodeKey,episode:episodeKey,exportedAt:new Date().toISOString(),records:await Promise.all(Object.entries(records).map(([id,record])=>exportRecord(record,currentKeys.has(id)))),legacyFeedback,savedToManifest:false};}
// The export function also permits local browser verification without initiating a download.
window.segmentReview={exportData};
document.querySelector('#export').onclick=async()=>{const button=document.querySelector('#export');button.disabled=true;try{const result=await exportData(),url=URL.createObjectURL(new Blob([JSON.stringify(result,null,2)],{type:'application/json'})),link=document.createElement('a');link.href=url;link.download='segment-review-feedback.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);status.textContent='已导出选择和图文意见，请将文件交给助手。'}catch(error){status.textContent='导出失败：'+error.message}finally{button.disabled=false}};
document.addEventListener('play',event=>{if(event.target.tagName==='VIDEO')document.querySelectorAll('video').forEach(video=>{if(video!==event.target)video.pause()})},true);
applyFilter();
})();
</script>
</body></html>
