<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>音频和字幕粗剪</title><link rel="icon" href="data:,"><link rel="stylesheet" href="styles.css"></head>
<body>
<header><div class="identity"><i data-lucide="audio-lines"></i><div><strong>音频和字幕粗剪</strong><small>口误初检 · 原始录音保留</small></div></div><div class="actions"><span id="saveStatus">正在载入</span><button id="undo" title="撤销" aria-label="撤销"><i data-lucide="undo-2"></i></button><button id="redo" title="重做" aria-label="重做"><i data-lucide="redo-2"></i></button><button id="export" class="primary"><i data-lucide="download"></i>导出初剪</button></div></header>
<div class="workspace"><main><div class="sectionbar"><div class="tabs"><button id="finalTab">完整成片</button><button id="transcriptTab" class="active">字幕审查</button><button id="scriptTab">参考逐字稿</button></div><input id="search" type="search" placeholder="搜索字幕" aria-label="搜索字幕"><label><input id="onlyCuts" type="checkbox">只看候选</label></div><div class="summary"><span id="stats"></span><span class="legend"><b class="gray"></b>拟删除 <b class="amber"></b>待试听</span></div><div id="transcript" class="transcript"></div><pre id="script" hidden></pre><section id="finalPreview" hidden><div class="final-player"><div class="final-heading"><div><h1>完整音频</h1><p id="finalInfo">正在载入导出文件</p></div><div class="final-downloads"><a href="/final/audio.wav" download="review-final-audio-v1.wav"><i data-lucide="download"></i>音频</a><a href="/final/subtitles.srt" download="review-final-subtitles-v1.srt"><i data-lucide="file-text"></i>字幕</a></div></div><div id="finalCaption" aria-live="off">完整音频</div><audio id="finalAudio" controls preload="metadata"></audio><div class="final-options"><label><input id="followFinal" type="checkbox" checked>跟随播放</label><select id="finalSpeed" aria-label="成片播放速度"><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select><span id="finalClock">00:00.000</span></div></div><div id="finalTranscript"></div></section></main>
<aside><div class="sectionbar"><strong>剪切审查</strong><span id="count"></span></div><div id="inspector"></div><div class="listbar"><span>候选片段</span><select id="filter" aria-label="筛选候选"><option value="all">全部</option><option value="pending">待试听</option><option value="enabled">已启用</option></select></div><div id="cutList"></div></aside></div>
<footer><div class="transport"><div class="playgroup"><button id="play" class="round" title="播放 / 暂停" aria-label="播放"><i data-lucide="play"></i></button><span id="clock">00:00.000</span><small id="editedClock"></small></div><div class="segments"><button id="original" class="active">原音</button><button id="edited">初剪</button></div><div class="zoom"><i data-lucide="zoom-in"></i><input id="zoom" type="range" min="1" max="12" step="1" value="1" aria-label="波形缩放"></div><button id="add"><i data-lucide="scissors"></i>新增剪切</button></div><div id="waveScroll"><canvas id="wave" height="120"></canvas></div><div class="rangebar"><label>选区起点 <input id="rangeStart" type="number" min="0" step="0.01" value="0"></label><label>终点 <input id="rangeEnd" type="number" min="0" step="0.01" value="1"></label><span id="notice">句级字幕初检，未完成听审。句内标灰为估算。</span></div></footer>
<dialog id="subtitleDialog" aria-labelledby="subtitleTitle"><form id="subtitleForm"><div class="dialog-head"><strong id="subtitleTitle">编辑字幕</strong><button type="button" id="closeSubtitle" aria-label="关闭字幕编辑" title="关闭"><i data-lucide="x"></i></button></div><label for="subtitleText">字幕文字</label><textarea id="subtitleText" maxlength="2000" rows="4" required></textarea><div class="original-caption"><span>剪映原识别</span><p id="subtitleOriginal"></p></div><p id="subtitleError" role="alert"></p><div class="dialog-actions"><button type="button" id="resetSubtitle"><i data-lucide="rotate-ccw"></i>恢复校正版</button><button type="button" id="cancelSubtitle">取消</button><button type="submit" id="saveSubtitle" class="primary"><i data-lucide="check"></i>保存</button></div></form></dialog>
<div id="toast" role="status"></div><script src="vendor/lucide.min.js"></script><script src="app.js"></script></body></html>
